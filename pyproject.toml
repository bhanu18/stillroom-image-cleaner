[project]
name = "image-cleaning"
version = "0.1.0"
description = "Local, private image cleaning and workflow retrieval"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "httpx>=0.28,<1", "psutil>=6,<8", "pyyaml>=6,<7", "python-multipart>=0.0.20", "qdrant-client>=1.13,<2"]
[project.optional-dependencies]
models = ["torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.48,<5", "safetensors>=0.5,<1", "huggingface-hub>=0.28,<1", "timm>=1,<2", "einops>=0.8,<1", "kornia>=0.8,<1", "sentencepiece>=0.2,<1"]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
[project.scripts]
image-cleaning = "cleaner.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["cleaner"]
[tool.pytest.ini_options]
testpaths = ["tests/local"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
